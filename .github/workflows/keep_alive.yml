name: Keep Supabase Awake

on:
  schedule:
    # Every 3 days at 12:17 UTC (well inside Supabase's 7-day pause window).
    # Off-the-hour minute because GitHub delays/drops many :00 jobs.
    - cron: '17 12 */3 * *'
  workflow_dispatch: # Lets you run it by hand from the Actions tab

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY secret is missing (repo Settings → Secrets and variables → Actions)"
            exit 1
          fi
          # Calls the public.keepalive() database function (supabase-keepalive.sql).
          # It runs a real query — so Supabase counts the project as active — but
          # reads none of your tables, which the anon key can no longer access.
          # --fail makes the job go red if Supabase answers with an error.
          curl --fail --show-error --silent \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
          echo "Supabase responded OK at $(date -u)"
