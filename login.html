<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>90s Geek — Access Required</title>
    <link rel="icon" type="image/webp" href="images/90s_Geek_logo.webp">
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#050805">
    <meta name="apple-mobile-web-app-title" content="90s Geek">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Pinned to an exact version so a new release can't change the login page without you knowing -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
    <style>
        :root {
            --green:      #39e880;
            --green-dim:  #28c96a;
            --green-glow: rgba(57, 232, 128, 0.15);
            --cyan:       #00e5ff;
            --red:        #ff4466;
            --bg:         #050805;
            --surface:    #0e1610;
            --surface2:   #131d14;
            --border:     #243428;
            --border2:    #2c3e2e;
            --text:       #cce8d0;
            --text-dim:   #6b8a72;
            --text-muted: #3d5442;
            --mono:       'JetBrains Mono', 'Courier New', monospace;
            --sans:       'Space Grotesk', sans-serif;
            --radius:     10px;
            --radius-sm:  6px;
            --radius-lg:  16px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            background-color: var(--bg);
            background-image:
                linear-gradient(rgba(57, 232, 128, 0.018) 1px, transparent 1px),
                linear-gradient(90deg, rgba(57, 232, 128, 0.018) 1px, transparent 1px),
                radial-gradient(ellipse at 50% 0%, rgba(57, 232, 128, 0.04) 0%, transparent 55%),
                linear-gradient(160deg, #060d06 0%, #0a120a 50%, #080e08 100%);
            background-size: 40px 40px, 40px 40px, 100% 100%, 100% 100%;
            background-attachment: fixed;
            color: var(--text);
            font-family: var(--sans);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 50% 50%, transparent 50%, rgba(0,0,0,0.45) 100%);
            pointer-events: none;
            z-index: 0;
        }

        .login-wrap {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
        }

        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .logo-area img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid var(--green-dim);
            box-shadow: 0 0 30px var(--green-glow), 0 0 60px var(--green-glow), 0 0 90px rgba(57, 232, 128, 0.1);
            animation: logoGlow 3s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% { box-shadow: 0 0 30px var(--green-glow), 0 0 60px var(--green-glow), 0 0 90px rgba(57, 232, 128, 0.1); }
            50%       { box-shadow: 0 0 40px var(--green-glow), 0 0 80px var(--green-glow), 0 0 120px rgba(57, 232, 128, 0.2); }
        }

        .logo-area h1 {
            font-family: var(--mono);
            color: var(--green);
            font-size: 1.1em;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-align: center;
        }

        .logo-area p {
            font-family: var(--mono);
            color: var(--text-dim);
            font-size: 0.75em;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .terminal-box {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border2);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 0 40px rgba(57, 232, 128, 0.06), 0 8px 32px rgba(0,0,0,0.4);
        }

        .terminal-bar {
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot-red    { background: #ff5f57; }
        .dot-yellow { background: #febc2e; }
        .dot-green  { background: #28c840; }

        .terminal-title {
            font-family: var(--mono);
            font-size: 0.7em;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-left: 6px;
        }

        .terminal-body {
            padding: 28px 28px 32px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .prompt-line {
            font-family: var(--mono);
            font-size: 0.78em;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .prompt-line span {
            color: var(--green);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-family: var(--mono);
            font-size: 0.7em;
            color: var(--text-dim);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border2);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            color: var(--green);
            font-family: var(--mono);
            font-size: 0.95em;
            letter-spacing: 1px;
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .input-group input[type="password"] { letter-spacing: 3px; }

        .input-group input:focus {
            border-color: var(--green-dim);
            box-shadow: 0 0 0 3px var(--green-glow);
        }

        .input-group input::placeholder {
            color: var(--text-muted);
            letter-spacing: 2px;
        }

        /* Keep browser autofill / password managers from painting the fields light blue */
        .input-group input:-webkit-autofill,
        .input-group input:-webkit-autofill:hover,
        .input-group input:-webkit-autofill:focus {
            -webkit-text-fill-color: var(--green);
            -webkit-box-shadow: 0 0 0 1000px var(--surface2) inset;
            caret-color: var(--green);
            transition: background-color 9999s ease-out 0s;
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: transparent;
            border: 1px solid var(--green-dim);
            border-radius: var(--radius-sm);
            color: var(--green);
            font-family: var(--mono);
            font-size: 0.85em;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background var(--transition), box-shadow var(--transition), opacity var(--transition);
            margin-top: 4px;
        }

        .btn-login:hover:not(:disabled) {
            background: var(--green-glow);
            box-shadow: 0 0 16px var(--green-glow);
        }

        .btn-login:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn-login:disabled {
            opacity: 0.55;
            cursor: wait;
        }

        .btn-login:focus-visible {
            outline: 2px solid var(--green);
            outline-offset: 2px;
        }

        .error-msg {
            font-family: var(--mono);
            font-size: 0.75em;
            color: var(--red);
            letter-spacing: 1px;
            text-align: center;
            min-height: 1.2em;
            display: none;
        }

        .error-msg.visible {
            display: block;
            animation: flicker 0.3s ease;
        }

        @keyframes flicker {
            0%   { opacity: 0; }
            50%  { opacity: 1; }
            75%  { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 1em;
            background: var(--green);
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0; }
        }
    </style>
</head>
<body>

<div class="login-wrap">
    <div class="logo-area">
        <img src="images/90s_Geek_logo.webp" alt="90s Geek Logo">
        <h1>90's Geek</h1>
        <p>Lego Collection Manager</p>
    </div>

    <div class="terminal-box">
        <div class="terminal-bar">
            <div class="dot dot-red"></div>
            <div class="dot dot-yellow"></div>
            <div class="dot dot-green"></div>
            <span class="terminal-title">auth_required.sh</span>
        </div>
        <form class="terminal-body" id="login-form" novalidate>
            <div class="prompt-line">
                <span>$</span> ./authenticate --user restricted_area <span class="cursor"></span>
            </div>
            <div class="input-group">
                <label for="email-input">Email</label>
                <input type="email" id="email-input" name="email" placeholder="you@example.com"
                       autocomplete="username" autocapitalize="off" spellcheck="false" required autofocus>
            </div>
            <div class="input-group">
                <label for="password-input">Password</label>
                <input type="password" id="password-input" name="password" placeholder="••••••••"
                       autocomplete="current-password" required>
            </div>
            <div class="error-msg" id="error-msg" role="alert" aria-live="assertive"></div>
            <button type="submit" class="btn-login" id="login-btn">[ Enter ]</button>
        </form>
    </div>
</div>

<script>
    // -------------------------------------------------------
    // Supabase Auth login.
    // The password is checked by Supabase's servers, not in this
    // page, so nothing secret lives in the source anymore.
    // The URL and anon key below are meant to be public — what
    // protects your data is Row Level Security on the tables.
    // -------------------------------------------------------
    const SUPABASE_URL = 'https://sgmibyooymrocvojchxu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNnbWlieW9veW1yb2N2b2pjaHh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1Mzk0OTYsImV4cCI6MjA4NzExNTQ5Nn0.nLXsVr6mvsCQJijHsO2wkw49e0J4JZ-2oiLTpKZGmu0';

    // Per-tab flag the existing page <head> gates look for. It only
    // controls the redirect; core.js double-checks the real Supabase
    // session on every page and sends you back here if it's missing.
    const AUTH_FLAG = '90sgeek_auth';

    const form     = document.getElementById('login-form');
    const emailEl  = document.getElementById('email-input');
    const passEl   = document.getElementById('password-input');
    const btn      = document.getElementById('login-btn');
    const errMsg   = document.getElementById('error-msg');

    let db = null;
    try {
        // Session lives in sessionStorage → signed out when the tab/window closes.
        // Must match the setting in core.js.
        try { localStorage.removeItem('sb-sgmibyooymrocvojchxu-auth-token'); } catch {}
        db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true } });
    } catch {
        showError('⚠ Auth library failed to load — refresh to retry');
        btn.disabled = true;
    }

    function enterSite() {
        try { sessionStorage.setItem(AUTH_FLAG, 'true'); } catch {}
        window.location.replace('index.html');
    }

    function showError(text) {
        errMsg.textContent = text;
        errMsg.classList.remove('visible');
        void errMsg.offsetWidth; // force reflow to re-trigger the flicker animation
        errMsg.classList.add('visible');
    }

    function clearError() {
        errMsg.classList.remove('visible');
        errMsg.textContent = '';
    }

    // Already signed in (e.g. a new tab)? Skip straight to the site.
    // Otherwise make sure no stale flag is left behind.
    if (db) {
        db.auth.getSession().then(({ data }) => {
            if (data?.session) enterSite();
            else { try { sessionStorage.removeItem(AUTH_FLAG); } catch {} }
        });
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!db) return;
        clearError();

        const email    = emailEl.value.trim();
        const password = passEl.value;
        if (!email || !password) {
            showError('⚠ Enter your email and password');
            (email ? passEl : emailEl).focus();
            return;
        }

        btn.disabled = true;
        btn.textContent = '[ Authenticating… ]';

        try {
            const { error } = await db.auth.signInWithPassword({ email, password });
            if (!error) { enterSite(); return; }

            if (error.status === 429) {
                showError('⚠ Too many attempts — wait a minute and try again');
            } else if (error.status === 400 || /invalid/i.test(error.message)) {
                showError('⚠ Access denied — incorrect email or password');
            } else {
                showError('⚠ Login failed — ' + error.message);
            }
        } catch {
            showError('⚠ Can’t reach the auth server — check your connection');
        }

        passEl.value = '';
        passEl.focus();
        btn.disabled = false;
        btn.textContent = '[ Enter ]';
    });
</script>

</body>
</html>
